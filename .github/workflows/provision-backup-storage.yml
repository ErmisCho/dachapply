name: Provision backup storage

# One-shot setup for the nightly database backup. Run it manually once; after that
# .github/workflows/database-backup.yml just uploads into what this created.
#
# Kept separate from the backup job on purpose: creating a storage account is a different privilege
# from writing one blob a night, and the nightly job should not carry provisioning rights it needs
# exactly once. Both use AZURE_CREDENTIALS today, so that separation is organisational rather than
# enforced -- but it means the day this repo gets a narrower credential, only this file changes.
#
# Safe to re-run: every step is create-if-missing, and none of them deletes anything.

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Delete backups older than this many days'
        required: false
        default: '30'

permissions: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check configuration
        shell: bash
        env:
          ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
          CONTAINER: ${{ vars.BACKUP_STORAGE_CONTAINER }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          : "${ACCOUNT:?repository variable BACKUP_STORAGE_ACCOUNT is not set}"
          : "${CONTAINER:?repository variable BACKUP_STORAGE_CONTAINER is not set}"
          [ -n "${AZURE_CREDENTIALS:-}" ] || { echo "::error::secret AZURE_CREDENTIALS is not set"; exit 1; }
          # Storage account names are global, 3-24 chars, lowercase alphanumeric only. Catching this
          # here gives a readable message instead of an opaque Azure validation error mid-create.
          echo "$ACCOUNT" | grep -Eq '^[a-z0-9]{3,24}$' \
            || { echo "::error::BACKUP_STORAGE_ACCOUNT '$ACCOUNT' must be 3-24 lowercase alphanumerics"; exit 1; }

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Azure reports a missing/unregistered resource provider as "SubscriptionNotFound", which sends
      # you looking at the wrong thing. This step never fails the run; it just states what the
      # credential can actually see, so a failure below is diagnosable from the log alone.
      - name: What this credential can see
        continue-on-error: true
        shell: bash
        run: |
          echo "--- identity ---"
          az account show --query '{name:name,id:id,tenant:tenantId,user:user.name}' -o yaml || true
          echo "--- subscriptions visible ---"
          az account list --all --query '[].{name:name,id:id,state:state}' -o table || true
          echo "--- resource groups visible ---"
          az group list --query '[].name' -o tsv || true
          echo "--- Microsoft.Storage registration state ---"
          az provider show --namespace Microsoft.Storage --query registrationState -o tsv || echo "(cannot read provider registration)"
          echo "--- storage accounts in the app's resource group ---"
          az storage account list --resource-group rg-dachapply --query '[].name' -o tsv || echo "(cannot list storage in rg-dachapply)"

      # This subscription has never used Azure Storage, so the Microsoft.Storage resource provider
      # sits at NotRegistered -- and Azure reports calls against an unregistered provider as
      # "SubscriptionNotFound", which is what sent the first three attempts chasing the wrong thing.
      # Registration is idempotent and subscription-scoped; if the credential is only scoped to the
      # resource group it will fail here with a clear message instead of a misleading one later.
      - name: Ensure the Microsoft.Storage provider is registered
        shell: bash
        run: |
          set -euo pipefail
          state=$(az provider show --namespace Microsoft.Storage --query registrationState -o tsv)
          echo "Microsoft.Storage: $state"
          if [ "$state" != "Registered" ]; then
            if ! err=$(az provider register --namespace Microsoft.Storage --wait 2>&1); then
              echo "$err"
              echo "::error::Microsoft.Storage is $state and this credential cannot register it."
              echo "::error::An owner of the subscription needs to run once: az provider register --namespace Microsoft.Storage"
              exit 1
            fi
            echo "registered: $(az provider show --namespace Microsoft.Storage --query registrationState -o tsv)"
          fi

      - name: Create the storage account and private container
        shell: bash
        env:
          ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
          CONTAINER: ${{ vars.BACKUP_STORAGE_CONTAINER }}
        run: |
          set -euo pipefail

          # Derive BOTH the subscription and the resource group from the app's own resource id.
          # Taking only the resource group and trusting the login's default subscription is what
          # broke the first run: `az containerapp list` found rg-dachapply, then the very next
          # storage call failed with SubscriptionNotFound, because the credential's default
          # subscription is not the one holding the app. The id is
          # /subscriptions/<sub>/resourceGroups/<rg>/... so both fall out of one lookup.
          APP_ID=$(az containerapp list --query "[?name=='dachapply'].id | [0]" -o tsv)
          if [ -z "$APP_ID" ]; then
            echo "::error::could not find the dachapply container app in any accessible subscription"
            echo "subscriptions this credential can see:"
            az account list --query '[].{name:name,id:id}' -o tsv || true
            exit 1
          fi
          SUB=$(echo "$APP_ID" | cut -d/ -f3)
          RG=$(echo "$APP_ID" | cut -d/ -f5)
          az account set --subscription "$SUB"
          LOCATION=$(az group show --name "$RG" --query location -o tsv)
          echo "subscription: $SUB"
          echo "resource group: $RG ($LOCATION)"

          # Every call here is RESOURCE-GROUP scoped on purpose. `az storage account check-name` is
          # subscription scoped and returned SubscriptionNotFound for this credential even though
          # the very same credential can read the resource group -- so the name check is done by
          # letting `create` fail and reading its error, rather than by asking first.
          if az storage account show --name "$ACCOUNT" --resource-group "$RG" --only-show-errors -o none 2>/dev/null; then
            echo "storage account $ACCOUNT already exists -- leaving it alone"
          else
            # allow-blob-public-access false is the whole point: these are user job searches.
            if ! err=$(az storage account create \
                --name "$ACCOUNT" --resource-group "$RG" --location "$LOCATION" \
                --sku Standard_LRS --kind StorageV2 \
                --allow-blob-public-access false --min-tls-version TLS1_2 \
                --only-show-errors --output none 2>&1); then
              echo "$err"
              case "$err" in
                *AlreadyExists*|*already\ taken*|*AccountNameInvalid*)
                  echo "::error::storage account name '$ACCOUNT' is unavailable globally -- pick another and update the BACKUP_STORAGE_ACCOUNT repository variable" ;;
                *Authorization*|*Forbidden*|*SubscriptionNotFound*)
                  echo "::error::AZURE_CREDENTIALS cannot create a storage account in $RG -- it needs Contributor on that resource group" ;;
              esac
              exit 1
            fi
            echo "created storage account $ACCOUNT"
          fi

          AZURE_STORAGE_KEY=$(az storage account keys list --account-name "$ACCOUNT" --resource-group "$RG" --query '[0].value' -o tsv)
          export AZURE_STORAGE_KEY
          export AZURE_STORAGE_ACCOUNT="$ACCOUNT"

          az storage container create --name "$CONTAINER" --public-access off --only-show-errors --output none
          echo "container $CONTAINER ready (private)"
          echo "RG=$RG" >> "$GITHUB_ENV"

      - name: Apply the retention rule
        shell: bash
        env:
          ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
          CONTAINER: ${{ vars.BACKUP_STORAGE_CONTAINER }}
          DAYS: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail
          # Retention lives here, not in the backup job, so that job never needs delete permission --
          # a compromised nightly run cannot destroy the backup history.
          az storage account management-policy create \
            --account-name "$ACCOUNT" --resource-group "$RG" \
            --policy "$(cat <<JSON
          {"rules":[{"enabled":true,"name":"expire-backups","type":"Lifecycle","definition":{
            "filters":{"blobTypes":["blockBlob"],"prefixMatch":["$CONTAINER/dachapply-"]},
            "actions":{"baseBlob":{"delete":{"daysAfterModificationGreaterThan":$DAYS}}}}}]}
          JSON
          )" --only-show-errors --output none
          echo "retention: blobs under $CONTAINER/dachapply- are deleted after $DAYS days"

      - name: Report what exists now
        shell: bash
        env:
          ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
          CONTAINER: ${{ vars.BACKUP_STORAGE_CONTAINER }}
        run: |
          set -euo pipefail
          AZURE_STORAGE_KEY=$(az storage account keys list --account-name "$ACCOUNT" --resource-group "$RG" --query '[0].value' -o tsv)
          export AZURE_STORAGE_KEY
          export AZURE_STORAGE_ACCOUNT="$ACCOUNT"
          echo "public blob access: $(az storage account show --name "$ACCOUNT" --resource-group "$RG" --query allowBlobPublicAccess -o tsv)"
          echo "container access:   $(az storage container show --name "$CONTAINER" --query properties.publicAccess -o tsv)"
          echo "blobs currently in the container:"
          az storage blob list --container-name "$CONTAINER" --query '[].{name:name,bytes:properties.contentLength}' -o tsv || true
          echo
          echo "Next: run the 'Database backup' workflow, then re-run the restore drill in docs/backup-restore.md against the first real blob."
