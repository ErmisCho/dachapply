name: Database backup

# docs/backup-restore.md was a runbook, not a backup: it told you how to run pg_dump but nothing
# ever ran one. This does, nightly.
#
# WHERE THE DUMP GOES, AND WHY NOT AN ARTIFACT
# ErmisCho/dachapply is a PUBLIC repository, and workflow artifacts inherit repository read access
# -- on a public repo that means anyone on the internet can download them. A dump of the production
# database is every user's job search, so `actions/upload-artifact` is forbidden here. Do not add it
# back unless the repository is private. The dump goes straight into private Azure Blob Storage
# (the project already runs on Azure).
#
# WHY THE SERVICE PRINCIPAL AND NOT A WRITE-ONLY SAS
# The first design used a container SAS with `--permissions cw`, which is genuinely tighter for this
# one job: create+write, no read, no delete. It was replaced because minting that SAS requires
# subscription access, so the workflow sat unrunnable waiting on a manual step -- and a backup that
# is not running is worth less than one with a broader token. `AZURE_CREDENTIALS` is already in this
# repository's CI and already able to update the Container App, so the blast radius if it leaks was
# not widened by using it here; what changed is that this job now has an Azure login it previously
# did not. If you ever move this repo to private, or get a SAS minted, tightening it back is the
# right call -- see docs/backup-restore.md for the SAS variant.
#
# Deleting old blobs is still NOT done from here: retention is an Azure Blob lifecycle rule, so a
# compromised CI run cannot destroy the backup history even with this credential.
#
# FAILING LOUD
# A backup job that "succeeds" while producing nothing is worse than no backup job, because it
# manufactures false confidence. Every step below either produces a verified dump or exits nonzero,
# and GitHub emails the repository owner on workflow failure -- the same mechanism uptime-monitor.yml
# already relies on.

on:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose: GitHub's scheduler queues hardest at :00.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    # A pg_dump hung against an unreachable Neon would otherwise burn hours before anyone is told.
    timeout-minutes: 30

    steps:
      - name: Check required secrets are configured
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${DATABASE_URL:-}" ] || { echo "::error::secret DATABASE_URL is not set"; missing=1; }
          [ -n "${AZURE_CREDENTIALS:-}" ] || { echo "::error::secret AZURE_CREDENTIALS is not set"; missing=1; }
          # Fail here rather than three steps later with a confusing libpq or 403 error.
          [ "$missing" -eq 0 ] || { echo "::error::see docs/backup-restore.md"; exit 1; }

      - name: Dump the production database
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          DUMP="dachapply-$(date -u +%Y%m%dT%H%M%SZ).dump"
          echo "DUMP=$DUMP" >> "$GITHUB_ENV"

          # The runner's bundled pg_dump lags Neon's server major, and pg_dump refuses to dump a
          # newer server. Pinning the client image keeps that a one-line bump instead of an outage.
          # Must be >= the Neon server major -- check with: SELECT version();
          # `-e DBURL` with no value inherits from this shell's environment, so the connection
          # string never appears in any argv on the runner.
          export DBURL="$DATABASE_URL"
          docker run --rm -e DBURL postgres:17-alpine \
            sh -c 'pg_dump "$DBURL" --format=custom --no-owner --no-acl' > "$DUMP"

          ls -l "$DUMP"

      - name: Verify the dump is real before uploading it
        shell: bash
        run: |
          set -euo pipefail

          # 1. Size floor. The 2026-08-16 restore drill produced 72,350 bytes from a freshly
          #    migrated, near-empty database, so anything under 20 KB is a truncated or failed dump.
          size=$(stat -c %s "$DUMP")
          echo "dump size: $size bytes"
          if [ "$size" -lt 20000 ]; then
            echo "::error::dump is only $size bytes -- refusing to upload a truncated backup"
            exit 1
          fi

          # 2. pg_restore --list parses the whole custom-format table of contents, so it fails on a
          #    corrupt or half-written file that the size check would wave through.
          docker run --rm -v "$PWD:/w" -w /w postgres:17-alpine \
            pg_restore --list "$DUMP" > toc.txt

          # 3. Content floor. A dump that authenticated but selected nothing is the silent failure
          #    this whole workflow exists to prevent. The drill measured 21 TABLE DATA entries;
          #    migrations only ever add tables, so 15 is a floor with room to spare.
          # `|| true`: grep exits 1 on zero matches, which under `set -e` would kill the step
          # silently -- and zero matches is precisely the failure this guard exists to report.
          tables=$(grep -c 'TABLE DATA' toc.txt || true)
          echo "TABLE DATA entries: $tables"
          if [ "$tables" -lt 15 ]; then
            echo "::error::dump contains only $tables TABLE DATA entries -- expected at least 15"
            exit 1
          fi

      # Uses the JSON-credentials form of AZURE_CREDENTIALS, not OIDC, so `permissions: {}` above
      # stays correct -- no `id-token: write` is needed.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload to private Azure Blob Storage
        shell: bash
        env:
          ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
          CONTAINER: ${{ vars.BACKUP_STORAGE_CONTAINER }}
        run: |
          set -euo pipefail
          : "${ACCOUNT:?repository variable BACKUP_STORAGE_ACCOUNT is not set -- run the Provision backup storage workflow}"
          : "${CONTAINER:?repository variable BACKUP_STORAGE_CONTAINER is not set -- run the Provision backup storage workflow}"

          # Pin the subscription from the app's own resource id before touching storage. The
          # credential's default subscription is NOT the one holding this app, so anything that
          # relies on the default fails with a confusing SubscriptionNotFound.
          APP_ID=$(az containerapp list --query "[?name=='dachapply'].id | [0]" -o tsv)
          test -n "$APP_ID" || { echo "::error::could not find the dachapply container app in any accessible subscription"; exit 1; }
          az account set --subscription "$(echo "$APP_ID" | cut -d/ -f3)"
          RG=$(echo "$APP_ID" | cut -d/ -f5)

          # Resource-group scoped, deliberately: `az storage account list` is subscription scoped and
          # this credential cannot make subscription-level calls, even for resources it can otherwise
          # read. The backups live in the app's own resource group, so the id gives us both.
          az storage account show --name "$ACCOUNT" --resource-group "$RG" --only-show-errors -o none \
            || { echo "::error::storage account $ACCOUNT not found in $RG -- run the Provision backup storage workflow first"; exit 1; }

          # Fetch the key into the environment rather than passing it as an argument: anything in
          # argv is readable from `ps` by any other process on the runner. az reads AZURE_STORAGE_KEY
          # and AZURE_STORAGE_ACCOUNT directly, so the key never becomes a command-line token.
          AZURE_STORAGE_KEY=$(az storage account keys list --account-name "$ACCOUNT" --resource-group "$RG" --query '[0].value' -o tsv)
          export AZURE_STORAGE_KEY
          export AZURE_STORAGE_ACCOUNT="$ACCOUNT"

          # --validate-content sends an MD5 that Azure checks server-side and rejects on mismatch,
          # so a silently corrupted transfer fails the run instead of leaving a bad backup in place.
          # --overwrite false: a name collision means something is wrong (two runs in one second),
          # and clobbering a good backup is worse than failing.
          az storage blob upload \
            --container-name "$CONTAINER" \
            --name "$DUMP" \
            --file "$DUMP" \
            --validate-content \
            --overwrite false \
            --only-show-errors \
            --output none

          echo "uploaded $DUMP to $ACCOUNT/$CONTAINER"

          # Retention is an Azure Blob lifecycle management rule on the account, not code here --
          # see docs/backup-restore.md. This job never deletes, so a compromised run cannot destroy
          # the backup history even though it now holds a broader credential than a write-only SAS.
