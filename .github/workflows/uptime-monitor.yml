name: Uptime monitor

# The deploy workflow already curls the app once, immediately after shipping. That catches a broken
# release but says nothing about the hours in between -- a database outage or a crashed revision
# would otherwise be discovered only on the next manual visit. This checks every 30 minutes and
# fails the run when it cannot, which GitHub reports by email.
#
# Owner, 2026-10-09: every 30 minutes on weekdays, 08:00-18:00 Berlin time only. GitHub cron is
# UTC, so the schedule covers both CET and CEST and the first step skips runs outside local hours.
# (TASK-275 blamed this probe for the Azure bill; that was wrong -- it was minReplicas=1, TASK-257.)

on:
  schedule:
    - cron: '*/30 6-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Overridable via repository variable APP_URL if the hostname ever changes.
  DEFAULT_APP_URL: https://dachapply.livelysea-3461ad21.westeurope.azurecontainerapps.io

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Skip outside 08:00-18:00 Berlin
        id: hours
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          if [ "$hour" -ge 8 ] && [ "$hour" -lt 18 ]; then echo "in=1" >> "$GITHUB_OUTPUT"; else echo "outside local hours ($hour)"; fi

      - name: Probe the health endpoint
        if: github.event_name != 'schedule' || steps.hours.outputs.in == '1'
        shell: bash
        run: |
          set -uo pipefail
          APP_URL="${{ vars.APP_URL || '' }}"
          [ -n "$APP_URL" ] || APP_URL="$DEFAULT_APP_URL"
          echo "probing $APP_URL/api/health/"

          # Three attempts: a single blip during a Container Apps revision swap is not an outage.
          for attempt in 1 2 3; do
            body=$(curl --fail --silent --show-error --max-time 20 "$APP_URL/api/health/") && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "response: $body"
              # jobradar.views.health already returns 503 with {"status":"degraded",
              # "database":"unavailable"} when Postgres is unreachable, so --fail catches that.
              # The body check is a second line of defence in case the endpoint is ever changed to
              # answer 200 while degraded.
              if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"database":"ok"'; then
                echo "healthy"
                exit 0
              fi
              echo "endpoint answered but reported unhealthy"
            else
              echo "attempt $attempt failed (curl exit $rc)"
            fi
            [ "$attempt" -lt 3 ] && sleep 20
          done

          echo "::error::dachapply health check failed after 3 attempts against $APP_URL"
          exit 1
      # The mailbox-health probe was removed: mail is checked only while the local app runs (TASK-276),
      # so that probe would email a stale-mailbox alert after every weekend.
