[project]
name = "dachapply"
version = "0.1.0"
description = "Private job-application command center: Django REST backend + React/TypeScript frontend."
requires-python = ">=3.13"

# Kept in sync with requirements.txt, which the Dockerfile and .github/workflows/deploy-azure.yml
# still consume. uv drives local development; requirements.txt drives the container build.
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",
    "whitenoise>=6.6",
    "gunicorn>=22.0",
    "openpyxl>=3.1",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.uv]
# The repo is an application, not an installable library -- nothing to build or publish.
package = false
