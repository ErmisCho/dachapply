[project]
name = "dachapply"
version = "0.1.0"
description = "Private job-application command center: Django REST backend + React/TypeScript frontend."
requires-python = ">=3.13"

# uv.lock is the single source of truth: local dev, the container image and CI all install from it.
# requirements.txt is now a generated export (`uv export --no-dev --no-hashes --no-emit-project
# --format requirements-txt -o requirements.txt`), kept only because the legacy App Service zip
# deploy may still auto-detect it. Regenerate it after changing anything here -- see TASK-65.
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",
    "whitenoise>=6.6",
    "gunicorn>=22.0",
    "openpyxl>=3.1",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.uv]
# The repo is an application, not an installable library -- nothing to build or publish.
package = false
